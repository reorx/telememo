[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telememo"
dynamic = ["version"]
description = "Dump Telegram channel messages to a local SQLite database for searching and archival"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Reorx", email = "novoreorx@gmail.com" },
]
keywords = [
    "telegram",
    "telethon",
    "sqlite",
    "archive",
    "backup",
    "cli",
    "channel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = [
    "telethon>=1.42.0,<2.0.0",
    "peewee>=3.18.0,<4.0.0",
    "click>=8.1.0,<9.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "cryptg>=0.4.0,<1.0.0",
    "rich>=13.7.0,<15.0.0",
    "readchar>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/reorx/telememo"
Repository = "https://github.com/reorx/telememo"
Issues = "https://github.com/reorx/telememo/issues"

[project.scripts]
telememo = "telememo.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "telememo.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["telememo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
